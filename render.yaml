services:
  - type: web
    name: eoms-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_DSN
        sync: false
      - key: WALLET_PASSWORD
        sync: false
      - key: BASE64_WALLET_ZIP
        sync: false

staticSites:
  - type: static
    name: eoms-frontend
    buildCommand: npm install && npm run build
    publishDir: frontend/dist
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        sync: false